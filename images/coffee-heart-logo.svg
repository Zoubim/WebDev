<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Coffee cup with a heart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Animated coffee-heart logo. Palette: espresso #3B2418 · cream #FFF7EC · coffee #5B3521 · heart #E0513F -->
  <style>
    .chl-heart{transform-origin:0 0}
    @media (prefers-reduced-motion:no-preference){
      .chl-steam{stroke-dasharray:100 110;animation:chl-rise 3s linear infinite}
      .chl-s2{animation-delay:-1s}
      .chl-s3{animation-delay:-2s}
      .chl-heart{animation:chl-beat 2.4s ease-in-out infinite}
    }
    @keyframes chl-rise{
      0%{stroke-dashoffset:100;opacity:0;transform:translateY(4px)}
      10%{opacity:1}
      45%,55%{stroke-dashoffset:0}
      80%{opacity:1}
      100%{stroke-dashoffset:-100;opacity:0;transform:translateY(-8px)}
    }
    @keyframes chl-beat{
      0%,42%,100%{transform:scale(1)}
      12%{transform:scale(1.14)}
      22%{transform:scale(.98)}
      32%{transform:scale(1.08)}
    }
  </style>
  <g transform="translate(-3 -5)">
    <!-- saucer -->
    <g fill="#FFF7EC" stroke="#3B2418" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 198V207A90 15 0 0 0 208 207V198Z"/>
      <ellipse cx="118" cy="198" rx="90" ry="15"/>
    </g>
    <ellipse cx="118" cy="197" rx="50" ry="8" fill="#EAD7C0"/>
    <!-- handle -->
    <path d="M179 120C200 114 214 124 212 140C210 156 190 164 170 164" fill="none" stroke="#3B2418" stroke-width="24" stroke-linecap="round"/>
    <path d="M179 120C200 114 214 124 212 140C210 156 190 164 170 164" fill="none" stroke="#FFF7EC" stroke-width="8" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M54 100C54 148 70 184 96 194Q118 200 140 194C166 184 182 148 182 100Z" fill="#FFF7EC"/>
    <path d="M182 104C182 148 166 184 140 194C156 180 168 152 168 104Z" fill="#F1DEC6"/>
    <path d="M54 100C54 148 70 184 96 194Q118 200 140 194C166 184 182 148 182 100" fill="none" stroke="#3B2418" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="118" cy="100" rx="64" ry="14" fill="#FFF7EC" stroke="#3B2418" stroke-width="8"/>
    <ellipse cx="118" cy="101" rx="52" ry="8" fill="#5B3521"/>
    <path d="M86 99.5C96 96.5 108 95.5 118 95.5" fill="none" stroke="#8A5634" stroke-width="2.5" stroke-linecap="round"/>
    <!-- heart -->
    <g transform="translate(118 154)">
      <g class="chl-heart">
        <path d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#E0513F"/>
        <path d="M-16.5-12.5C-16.5-16-14-18.6-10.8-18.6" fill="none" stroke="#FFF7EC" stroke-width="3.8" stroke-linecap="round"/>
      </g>
    </g>
    <!-- steam -->
    <g fill="none" stroke="#3B2418" stroke-width="7" stroke-linecap="round">
      <path class="chl-steam" pathLength="100" d="M118 76C110 68 110 60 118 52C126 44 126 36 118 28"/>
      <path class="chl-steam chl-s2" pathLength="100" d="M93 79C86 72 86 65 93 58C100 51 100 44 93 37"/>
      <path class="chl-steam chl-s3" pathLength="100" d="M143 79C136 72 136 65 143 58C150 51 150 44 143 37"/>
    </g>
  </g>
</svg>
