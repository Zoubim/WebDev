<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Coffee cup with latte art heart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Animated latte-art logo. Palette: espresso #3B2418 · cream #FFF7EC · coffee #6B3E24 · crema #A86A40 -->
  <style>
    .cll-art{transform-origin:0 0}
    @media (prefers-reduced-motion:no-preference){
      .cll-steam{stroke-dasharray:100 110;animation:cll-rise 3s linear infinite}
      .cll-s2{animation-delay:-1s}
      .cll-s3{animation-delay:-2s}
      .cll-art{animation:cll-beat 2.4s ease-in-out infinite}
    }
    @keyframes cll-rise{
      0%{stroke-dashoffset:100;opacity:0;transform:translateY(4px)}
      10%{opacity:1}
      45%,55%{stroke-dashoffset:0}
      80%{opacity:1}
      100%{stroke-dashoffset:-100;opacity:0;transform:translateY(-8px)}
    }
    @keyframes cll-beat{
      0%,42%,100%{transform:scale(1)}
      12%{transform:scale(1.08)}
      22%{transform:scale(.99)}
      32%{transform:scale(1.04)}
    }
  </style>
  <g transform="translate(5 7) scale(.96)">
    <!-- saucer -->
    <g fill="#FFF7EC" stroke="#3B2418" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 176V184A96 34 0 0 0 210 184V176Z"/>
      <ellipse cx="114" cy="176" rx="96" ry="34"/>
    </g>
    <ellipse cx="114" cy="178" rx="56" ry="16" fill="#EAD7C0"/>
    <!-- handle -->
    <path d="M178 114C202 107 218 121 214 137C210 152 192 158 172 153" fill="none" stroke="#3B2418" stroke-width="24" stroke-linecap="round"/>
    <path d="M178 114C202 107 218 121 214 137C210 152 192 158 172 153" fill="none" stroke="#FFF7EC" stroke-width="8" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M48 98C48 146 78 188 114 188C150 188 180 146 180 98Z" fill="#FFF7EC"/>
    <path d="M180 104C180 146 154 184 122 187.5C148 176 166 146 166 104Z" fill="#F1DEC6"/>
    <path d="M48 98C48 146 78 188 114 188C150 188 180 146 180 98" fill="none" stroke="#3B2418" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="114" cy="98" rx="66" ry="30" fill="#FFF7EC" stroke="#3B2418" stroke-width="8"/>
    <!-- coffee + crema -->
    <ellipse cx="114" cy="100" rx="57" ry="23" fill="#6B3E24"/>
    <ellipse cx="114" cy="101" rx="50" ry="19.5" fill="#A86A40"/>
    <!-- latte art: rippled heart drawn flat, laid onto the surface -->
    <g transform="translate(114 99.5) scale(1.5 .7)">
      <g class="cll-art">
        <path d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#FFF7EC"/>
        <path transform="translate(0 21) scale(.76) translate(0 -21)" d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#A86A40"/>
        <path transform="translate(0 21) scale(.62) translate(0 -21)" d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#FFF7EC"/>
        <path transform="translate(0 21) scale(.44) translate(0 -21)" d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#A86A40"/>
        <path transform="translate(0 21) scale(.32) translate(0 -21)" d="M0 21C-2 19-25 6.5-25-8.5C-25-17.5-18.5-24-11.5-24C-6-24-1.6-20.5 0-15.5C1.6-20.5 6-24 11.5-24C18.5-24 25-17.5 25-8.5C25 6.5 2 19 0 21Z" fill="#FFF7EC"/>
        <path d="M0 16V32" fill="none" stroke="#FFF7EC" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
    <!-- steam -->
    <g fill="none" stroke="#3B2418" stroke-width="7" stroke-linecap="round">
      <path class="cll-steam" pathLength="100" d="M114 58C107 51 107 45 114 38C121 31 121 25 114 18"/>
      <path class="cll-steam cll-s2" pathLength="100" d="M90 61C84 55 84 50 90 44C96 38 96 33 90 27"/>
      <path class="cll-steam cll-s3" pathLength="100" d="M138 61C132 55 132 50 138 44C144 38 144 33 138 27"/>
    </g>
  </g>
</svg>
